services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "3000"
    restart: unless-stopped

  task-archive-cron:
    build:
      context: .
      dockerfile: docker/cron/Dockerfile
    depends_on:
      - app
    environment:
      APP_INTERNAL_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      TZ: Europe/Moscow
    restart: unless-stopped

  ppr-cron:
    build:
      context: .
      dockerfile: docker/ppr-cron/Dockerfile
    depends_on:
      - app
    environment:
      APP_INTERNAL_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      TZ: Europe/Moscow
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      # На хосте 80/443 заняты их инфраструктурой → биндим на 8080/9443.
      # Внутрь контейнера Caddy слушает стандартные 80/443.
      # Корп-инфра NAT-ит внешний 80→8080 и 443→9443 уже на своей стороне.
      - "8080:80"
      - "9443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
